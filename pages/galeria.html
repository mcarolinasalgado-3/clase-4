<body>
    <header>
        <div><a href="#"><img src="../img/elgalpon-logo.jpg" alt="logo de El Galpón"></a></div>
        <nav>
            <ul>
                <li><a href="../index.html">Inicio</a></li>

                <li><a href="./eventos.html">Eventos</a></li>
                <li><a href="./contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1 class="lobster-regular">¡Conocé nuestras cervezas!</h1>
        <section class="galeria">
            <figure>
                <img src="../img/barley.jpg" alt="Cerveza Barley">
                <figcaption class="texto-imagenes">Cerveza Barley: Del estilo Ale muy fuerte y complejo, con un
                    contenido de alcohol de 8% a 12% o más.</figcaption>
            </figure>
            <figure>
                <img src="../img/blackipa.jpg" alt="Cerveza Black Ipa">
                <figcaption class="texto-imagenes"> Cerveza Black Ipa: Es un estilo híbrido que combina la apariencia
                    oscura y el sutil trasfondo de una malta tostada con el potente amargor, sabor y aroma a lúpulo.
                </figcaption>
            </figure>
            <figure>
                <img src="../img/bock.jpg" alt="Cerveza Bock">
                <figcaption class="texto-imagenes"> Cerveza Bock: Estilo tradicional alemán de baja fermentación
                    (lager), famoso por su cuerpo robusto, su graduación alcohólica elevada (usualmente entre 6% y
                    7,5%).</figcaption>
            </figure>
            <figure>
                <img src="../img/frambuesa.jpg" alt="Cerveza Frambuesa">
                <figcaption class="texto-imagenes"> Cerveza Strawberry: La frutal más popular del mundo, caracterizada
                    por su balance entre el dulzor natural de la fruta y notas sutilmente ácidas o refrescantes.
                </figcaption>
            </figure>
            <figure>
                <img src="../img/honey.jpg" alt="Cerveza Honey">
                <figcaption class="texto-imagenes"> Cerveza Honey: Ofrece un color dorado intenso, cuerpo moderado, bajo
                    amargor y un aroma floral característico.</figcaption>
            </figure>
            <figure>
                <img src="../img/ipa.jpg" alt="Cerveza IPA">
                <figcaption class="texto-imagenes"> Cerveza IPA: De alta fermentación que destaca por su intenso
                    amargor, aroma frutal o cítrico y mayor graduación alcohólica. </figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p class="texto-footer">Todos los derechos reservados</p>
